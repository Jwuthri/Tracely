[project]
name = "tracely-agents-demo"
version = "0.1.0"
description = "End-to-end demos: LangGraph, OpenAI Agents SDK and Anthropic agents, traced by Tracely."
requires-python = ">=3.10"
dependencies = [
  # tracely-ai + the auto-instrumentors for each framework (extras pull the framework SDKs too)
  # Floor stays at the version on PyPI — raise it to >=0.4.0 once `sdk-v0.4.0` publishes
  # (`uv lock --upgrade-package tracely-ai` picks it up either way).
  "tracely-ai[langchain,openai-agents,anthropic]>=0.3.3",
  # LangGraph demo (the [langchain] extra only ships the instrumentor)
  "langchain>=1.0",
  "langgraph>=1.0",
  "langchain-openai>=1.0",
  "python-dotenv>=1.0",
  # server.py: serve the agents over HTTP so Tracely scenarios can drive them
  "fastapi>=0.115",
  "uvicorn>=0.30",
]